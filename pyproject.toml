[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-workflow"
version = "0.4.0"
requires-python = ">=3.10"
description = "Hook-driven dev workflow enforcement for Claude Code"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "LEE TICK HUAT" }]
keywords = ["claude", "claude-code", "workflow", "hooks", "agentic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "PyYAML>=6.0",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/tickhuat/claude-workflow"
Source = "https://github.com/tickhuat/claude-workflow"
Issues = "https://github.com/tickhuat/claude-workflow/issues"
Changelog = "https://github.com/tickhuat/claude-workflow/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["claude_workflow*"]

[tool.setuptools.package-data]
# `**` does not descend into dotdirs in setuptools globs; second pattern
# is needed to reach files directly under _templates/.claude/.
# IMPORTANT: when adding _templates/<new_subdir>/ (especially a non-dot
# subdir), extend this glob AND add the new files to REQUIRED_PATHS in
# tests/scripts/test_wheel_contents.py — otherwise they silently drop
# from the wheel without test coverage.
claude_workflow = ["_templates/.claude/**/*", "_templates/.claude/*"]

[project.scripts]
claude-workflow-init = "claude_workflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
