name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06 deadline so checkout/setup-python
  # @v4 / @v5 don't emit the deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest tests/ -q

  build-wheel:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
      - name: Twine metadata check
        run: python -m twine check dist/*
      - name: Install wheel into fresh venv
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install dist/*.whl
      - name: Smoke import
        run: |
          /tmp/wheel-smoke/bin/python -c "
          import claude_workflow
          import importlib.resources
          assert claude_workflow.__version__ == '0.4.0', claude_workflow.__version__
          tpl = importlib.resources.files('claude_workflow') / '_templates'
          assert tpl.is_dir(), f'_templates missing in installed package: {tpl}'
          assert (tpl / '.claude' / 'settings.json').is_file()
          assert (tpl / '.claude' / 'skills' / 'switch-mode-feature' / 'SKILL.md').is_file()
          print('wheel smoke OK')
          "
      - name: Verify console script
        run: /tmp/wheel-smoke/bin/claude-workflow-init --help

  init-fresh-e2e:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy source to scaffold target
        run: |
          # init-fresh.sh is destructive (wipes ADRs, specs, plans).
          # Run it against a copy so the checkout stays clean.
          cp -R source target
          cd target
          # Verify pre-state: ADRs and specs still present (the dogfood).
          test -d ADR
          test -n "$(ls docs/superpowers/specs)"
      - name: Run init-fresh.sh
        run: |
          cd target
          bash scripts/init-fresh.sh
      - name: Verify post-state
        run: |
          cd target
          # Dogfood removed:
          test -z "$(ls ADR/*.md 2>/dev/null | grep -v 0000-template.md)" \
            && echo "ADRs cleaned: OK" \
            || (echo "FAIL: non-template ADRs survived"; ls ADR; exit 1)
          test -z "$(ls docs/superpowers/specs/*.md 2>/dev/null)" \
            && echo "specs cleaned: OK" \
            || (echo "FAIL: specs survived"; exit 1)
          # Scaffold present:
          test -f .claude/settings.json
          test -f .claude/dev-rules.config.yaml
          test -f .claude/dev-state.json
          test -f .claude/.init-fresh-done  # idempotency marker from #42
          # Idempotency: second run aborts with non-zero.
          if bash scripts/init-fresh.sh; then
            echo "FAIL: second run should have failed"; exit 1
          else
            echo "idempotency guard: OK"
          fi
          # Hooks fire (return 0 or 2, both meaning "loaded successfully"):
          echo '' | .venv/bin/python -m claude_workflow.hooks.pre_edit
          rc=$?
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then
            echo "FAIL: pre_edit hook returned $rc"; exit 1
          fi
          echo "hooks fire: OK"
