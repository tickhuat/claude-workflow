name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06 deadline so checkout/setup-python
  # @v4 / @v5 don't emit the deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest tests/ -q

  build-wheel:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
      - name: Twine metadata check
        run: python -m twine check dist/*
      - name: Install wheel into fresh venv
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install dist/*.whl
      - name: Smoke import
        run: |
          /tmp/wheel-smoke/bin/python -c "
          import claude_workflow
          import importlib.resources
          assert claude_workflow.__version__ == '0.4.0', claude_workflow.__version__
          tpl = importlib.resources.files('claude_workflow') / '_templates'
          assert tpl.is_dir(), f'_templates missing in installed package: {tpl}'
          assert (tpl / '.claude' / 'settings.json').is_file()
          assert (tpl / '.claude' / 'skills' / 'switch-mode-feature' / 'SKILL.md').is_file()
          print('wheel smoke OK')
          "
      - name: Verify console script
        run: /tmp/wheel-smoke/bin/claude-workflow-init --help
